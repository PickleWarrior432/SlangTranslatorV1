<style>
  /* Layout: input and output sit side by side on wide screens (stacked on phones), joined by an arrow; the Translate button hangs under the input. */
  :root {
    --bg: #E9EFEC;
    --surface: #FBFDFC;
    --ink: #0F1D1A;
    --muted: #55655F;
    --ph: #66766F;
    --line: #CBD8D2;
    --chip: #E8F0EC;
    --sent: #0B7A6B;
    --sent-fg: #FFFFFF;
    --sent-ph: rgba(255, 255, 255, 0.8);
    --btn-bg: #0F1D1A;
    --btn-fg: #FFFFFF;
    --mark-bg: #FFD93D;
    --mark-fg: #101A24;
    --ring: rgba(11, 122, 107, 0.35);
    --shadow: 0 1px 0 rgba(15, 29, 26, 0.04), 0 14px 30px -20px rgba(15, 29, 26, 0.35);
    --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gap: 2.25rem;
    --label-h: 1.9rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1311;
      --surface: #14201D;
      --ink: #E7F0EC;
      --muted: #94A59E;
      --ph: #8A9B94;
      --line: #26352F;
      --chip: #1F2D28;
      --sent: #0F8473;
      --btn-bg: #E7F0EC;
      --btn-fg: #0B1311;
      --ring: rgba(70, 200, 180, 0.45);
      --shadow: 0 14px 30px -20px rgba(0, 0, 0, 0.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1311;
    --surface: #14201D;
    --ink: #E7F0EC;
    --muted: #94A59E;
    --ph: #8A9B94;
    --line: #26352F;
    --chip: #1F2D28;
    --sent: #0F8473;
    --btn-bg: #E7F0EC;
    --btn-fg: #0B1311;
    --ring: rgba(70, 200, 180, 0.45);
    --shadow: 0 14px 30px -20px rgba(0, 0, 0, 0.8);
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: clamp(1.5rem, 6vw, 4.5rem);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap {
    max-width: 64rem;
    margin-inline: auto;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.2rem, 8vw, 4rem);
    line-height: 1;
    letter-spacing: -0.04em;
    text-wrap: balance;
  }
  h1 .hl {
    text-decoration: underline;
    text-decoration-color: var(--mark-bg);
    text-decoration-thickness: 0.13em;
    text-decoration-skip-ink: none;
    text-underline-offset: 0.07em;
  }

  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "field" "go" "out";
    gap: 1.25rem;
  }
  .field { grid-area: field; display: flex; flex-direction: column; gap: 0.5rem; min-width: 0; }
  .go { grid-area: go; }
  .recv { grid-area: out; }

  label {
    font-size: 0.92rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.4;
    color: var(--muted);
  }

  .bubble { position: relative; min-width: 0; }
  .sent {
    flex: 1;
    background: var(--sent);
    color: var(--sent-fg);
    border-radius: 1.6rem 1.6rem 0.4rem 1.6rem;
    box-shadow: var(--shadow);
    transition: box-shadow 0.15s;
  }
  .sent:focus-within { box-shadow: 0 0 0 4px var(--ring); }
  .recv {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 1.6rem 1.6rem 1.6rem 0.4rem;
    box-shadow: var(--shadow);
  }

  textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    min-height: 6.5rem;
    margin: 0;
    padding: 1.2rem 3.5rem 1.2rem 1.4rem;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: inherit;
    caret-color: currentColor;
    font: inherit;
    font-size: 1.25rem;
    line-height: 1.45;
  }
  textarea::placeholder {
    color: var(--sent-ph);
    opacity: 1;
    transition: opacity 0.18s;
  }
  textarea.swapping::placeholder { opacity: 0; }

  .out {
    box-sizing: border-box;
    min-height: 6.5rem;
    padding: 1.2rem 3.5rem 1.2rem 1.4rem;
    font-size: 1.25rem;
    line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    transition: opacity 0.18s;
  }
  .out.swapping { opacity: 0; }
  .out.is-ph { color: var(--ph); }
  .swap {
    text-decoration: underline dotted var(--sent);
    text-decoration-thickness: 1.5px;
    text-underline-offset: 0.25em;
  }
  mark.unk {
    background: var(--mark-bg);
    color: var(--mark-fg);
    padding: 0 0.3em;
    border-radius: 0.3em;
    font-weight: 600;
  }

  .arrow {
    display: none;
    position: absolute;
    z-index: 1;
    top: 50%;
    left: calc(var(--gap) / -2 - 1.25rem);
    width: 2.5rem;
    height: 2.5rem;
    margin-top: -1.25rem;
    place-items: center;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--sent);
    box-shadow: var(--shadow);
  }
  .arrow svg {
    width: 1.15rem;
    height: 1.15rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .icon-btn {
    position: absolute;
    top: 0.65rem;
    right: 0.65rem;
    width: 2.5rem;
    height: 2.5rem;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }
  .icon-btn svg {
    width: 1.1rem;
    height: 1.1rem;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .sent .icon-btn { background: rgba(255, 255, 255, 0.18); color: var(--sent-fg); }
  .sent .icon-btn:hover { background: rgba(255, 255, 255, 0.32); }
  .sent .icon-btn:focus-visible { outline: 3px solid var(--sent-fg); outline-offset: 2px; }
  .recv .icon-btn { background: var(--chip); color: var(--ink); }
  .recv .icon-btn:hover:not(:disabled) { background: var(--line); }
  .recv .icon-btn:focus-visible { outline: 3px solid var(--sent); outline-offset: 2px; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .i-check { display: none; }
  .icon-btn.done .i-copy { display: none; }
  .icon-btn.done .i-check { display: block; }

  .go {
    justify-self: stretch;
    min-height: 3.1rem;
    padding: 0 2rem;
    border: 0;
    border-radius: 999px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .go:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -12px rgba(0, 0, 0, 0.55); }
  .go:active { transform: translateY(1px); box-shadow: none; }
  .go:focus-visible { outline: 3px solid var(--sent); outline-offset: 3px; }

  @media (min-width: 52rem) {
    .grid {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "field out" "go .";
      column-gap: var(--gap);
      row-gap: 1.5rem;
    }
    .go { justify-self: start; }
    .recv { margin-top: var(--label-h); }
    .arrow { display: grid; }
    textarea, .out { min-height: 9.5rem; font-size: 1.35rem; }
  }
  @media (max-width: 480px) {
    textarea, .out { font-size: 1.15rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<main class="wrap">
  <h1>Text <span class="hl">Slang</span> Translator</h1>

  <div class="grid">
    <div class="field">
      <label for="input">Paste text here:</label>
      <div class="bubble sent" id="sentBubble">
        <textarea id="input" rows="3" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
        <button class="icon-btn" id="clear" type="button" aria-label="Clear" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
    </div>

    <button class="go" id="go" type="button">Translate</button>

    <div class="bubble recv">
      <span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
      <div class="out is-ph" id="output" role="region" aria-label="Translation" aria-live="polite"></div>
      <button class="icon-btn" id="copy" type="button" aria-label="Copy translation" disabled>
        <svg class="i-copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="2"/><path d="M10.5 5.5v-1a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h1"/></svg>
        <svg class="i-check" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
      </button>
    </div>
  </div>
</main>

  var SLASH = Object.create(null);

  EMO['<3'] = '(heart)';
  EMO['</3'] = '(broken heart)';

    s: '(sarcastic)', j: '(joking)', srs: '(serious)', hj: '(half joking)', gen: '(genuine)',
    pos: '(positive tone)', neg: '(negative tone)', lh: '(lighthearted)', t: '(teasing)'

  // Words with no real vowels that should never become "???"
  var NOVOWEL_OK = /^(h+m+|m+|sh+|ps+t|br+|pf+t|tsk|nth|zz+|gr+|mhm|mr|mrs|ms|dr|st|nd|rd|th|pm|vs|jr|sr|hr|hrs|wk|wks|yr|yrs|mo|mph|kph|bpm|cm|mm|km|kg|lb|lbs|oz|ml|mg|ft|tbsp|tsp|ctrl|pts|gb|kb|tb|hz|mhz|ghz|kwh|my|by|why|try|cry|dry|fly|fry|shy|sky|sly|spy|pry|wry|thy|gym|myth|lynx|hymn|sync|rhythm|nymph|crypt|gypsy|www|http|https|html|css|tv|pc|cd|dvd|usb|gps|cpu|gpu|pdf|sql|ppt)$/;

  var RE = /https?:\/\/\S+|www\.\S+|\S+@\S+\.\S+|(?<!\S)(?:<3|<\/3|\^_\^|-_-|:\)|:\(|:D|:P|:O|:\||:\/|;\))(?!\S)|(?<![\w\/])(?:w\/o|b\/c|n\/a)(?![\w\/])|(?<![\w\/])w\/(?!\/)|(?<![\w\/])\/(?:srs|hj|gen|pos|neg|lh|s|j|t)(?![\w\/])|(?<!\S)\^+(?!\S)|tl;dr|[a-z0-9]+(?:['’][a-z]+)*/gi;

  function find(tok) {
    var lower = tok.toLowerCase().replace(/’/g, "'");
    var e = D[lower];
    if (!e && lower.length >= 3) {
      e = D[lower.replace(/(.)\1{2,}/g, '$1')] || D[lower.replace(/(.)\1+/g, '$1')];
    }
    if (!e) return null;
    if (e.c === 'upper' && !(tok === tok.toUpperCase() && tok.length >= 2)) return null;
    if (e.c === 'lower' && tok !== tok.toLowerCase()) return null;
    return e;
  }

  function allCaps(tok) {
    return tok.length > 1 && tok === tok.toUpperCase() && /[A-Z]/.test(tok);
  }

  function isShout(text) {
    var w = text.match(/\b[A-Za-z]{2,}\b/g) || [];
    if (w.length < 3) return false;
    var up = w.filter(function (x) { return x === x.toUpperCase(); }).length;
    return up / w.length >= 0.6;
  }

  function isUnknown(tok) {
    if (!/^[A-Za-z]+$/.test(tok) || tok.length < 2) return false;
    var l = tok.toLowerCase();
    if (tok !== l && tok !== tok.toUpperCase()) return false;
    if (/[aeiou]/.test(l)) return false;
    return !NOVOWEL_OK.test(l);
  }

  function translate(text) {
    var parts = [], last = 0, m;
    var shout = isShout(text);
    var re = new RegExp(RE.source, 'gi');
    while ((m = re.exec(text)) !== null) {
      var tok = m[0], i = m.index, low = tok.toLowerCase();
      var before = text.slice(0, i), after = text.slice(i + tok.length);
      var rep = null, unk = false;
      if (/^(https?:|www\.)/i.test(tok) || tok.indexOf('@') > -1) continue;
      if (EMO[low]) {
        rep = EMO[low];
      } else if (SLASH[low]) {
        rep = SLASH[low];
      } else if (tok.charAt(0) === '/') {
        rep = TONES[tok.slice(1).toLowerCase()] || null;
      } else if (tok.charAt(0) === '^') {
        rep = '(the message above)';
      } else {
        var hit = find(tok), e = hit;
        if (e && e.notTime && /\d\s*$/.test(before)) e = null;
        if (e && e.standalone && !(/(^|[.!?,;\n])\s*$/.test(before) && /^\s*([.!?,;\n]|$)/.test(after))) e = null;
        if (e) {
          rep = e.t;
          if (shout && allCaps(tok)) rep = rep.toUpperCase();
          else if (/(^|[.!?\n])\s*$/.test(before)) rep = rep.charAt(0).toUpperCase() + rep.slice(1);
        } else if (!hit && isUnknown(tok)) {
          unk = true;
        }
      }
      if (rep === null && !unk) continue;
      if (i > last) parts.push({ t: text.slice(last, i) });
      parts.push(unk ? { t: '???', from: tok, unk: true } : { t: rep, from: tok });
      last = i + tok.length;
    }
    if (last < text.length) parts.push({ t: text.slice(last) });
    return parts;
  }

    return parts.map(function (p) { return p.t; }).join('');
  }

  function fit() {

  function renderIdle() {
    out.className = 'out is-ph';
    out.textContent = EXT[idx];

    copyBtn.disabled = true;

  function renderResult(parts) {
    out.className = 'out';
    out.removeAttribute('aria-hidden');
    out.textContent = '';
    parts.forEach(function (p) {
      if (p.unk) {
        var mk = document.createElement('mark');
        mk.className = 'unk';
        mk.title = p.from;
        mk.textContent = p.t;
        out.appendChild(mk);
      } else if (p.from) {
        var sp = document.createElement('span');
        sp.className = 'swap';
        sp.title = p.from;
        sp.textContent = p.t;
        out.appendChild(sp);
      } else {
        out.appendChild(document.createTextNode(p.t));
      }

    lastPlain = plain(parts);

  }

  function showExample(n) {
    idx = n;
    ta.classList.add('swapping');

    if (!v.trim()) { ta.focus(); return; }

  clearBtn.addEventListener('click', function () {
    ta.value = '';
    hasResult = false;
    renderIdle();
    syncClear();
    fit();
    ta.focus();
  });

  sentBubble.addEventListener('mousedown', function (e) {
    if (e.target === sentBubble) { e.preventDefault(); ta.focus(); }
  });

  ta.addEventListener('input', function () {
    syncClear();
    fit();
    if (!ta.value.trim() && hasResult) { hasResult = false; renderIdle(); }
  });
  ta.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); go.click(); }
  });

  function flashDone() {
    copyBtn.classList.add('done');
    clearTimeout(copyTimer);
    copyTimer = setTimeout(function () { copyBtn.classList.remove('done'); }, 1600);
  }
  function fallbackCopy() {
    try {
      var r = document.createRange();
      r.selectNodeContents(out);
      var s = window.getSelection();
      s.removeAllRanges();
      s.addRange(r);
      if (document.execCommand && document.execCommand('copy')) flashDone();
    } catch (err) { /* the text stays selected so it can be copied by hand */ }
  }
  copyBtn.addEventListener('click', function () {
    if (copyBtn.disabled) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastPlain).then(flashDone, fallbackCopy);
      } else {
        fallbackCopy();
      }
    } catch (err) { fallbackCopy(); }
  });

  setInterval(function () {
    if (reduce || document.hidden || hasResult || ta.value || document.activeElement === ta) return;
    showExample((idx + 1) % EX.length);
  }, 5000);

  ta.placeholder = EX[0];
  renderIdle();
  syncClear();
  fit();
